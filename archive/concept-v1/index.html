<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMA Architects</title>
<meta name="description" content="Homepage concept for MMA, Mharrech Mribah Architects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=DM+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --calque:#E5E9E1;   /* tracing paper */
  --sheet:#F3F5F0;    /* lighter paper */
  --ink:#13211C;      /* drawing ink */
  --cedar:#1C4238;    /* cedar green */
  --cobalt:#1B2CA8;   /* cyanotype */
  --muted:#52605A;
  --line:rgba(19,33,28,.22);
  --display:"Archivo",system-ui,sans-serif;
  --body:"Newsreader",Georgia,serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --gutter:clamp(16px,3.2vw,48px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--calque);color:var(--ink);font:400 clamp(17px,1.25vw,19px)/1.5 var(--body);overflow-x:hidden}
h1,h2,h3,p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.mono{font:400 12px/1.4 var(--mono);letter-spacing:.02em}
h1,h2,.big{font-family:var(--display);font-stretch:72%;font-weight:500;letter-spacing:-.012em;line-height:.98}
h2{font-size:clamp(2.5rem,5.4vw,5rem)}
h3{font:600 1.15rem/1.2 var(--display);font-stretch:90%}
.wrap{padding-inline:var(--gutter)}
.section{padding-block:clamp(64px,9vw,128px)}
.section-head{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;margin-bottom:clamp(32px,4.5vw,64px);align-items:end}
.section-head h2{grid-column:1/8}
.section-head p{grid-column:8/13;color:var(--muted)}

.btn{display:inline-block;border:1.5px solid currentColor;padding:13px 20px;font:600 15px/1 var(--display);font-stretch:90%;text-decoration:none;background:none;color:inherit;cursor:pointer;transition:background .15s,color .15s}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.btn.solid:hover{background:var(--cobalt);border-color:var(--cobalt)}

/* Content MMA still has to supply */
.ph{border:1.5px dashed var(--cobalt);color:var(--cobalt);display:flex;align-items:flex-end;padding:10px;font:400 12px/1.35 var(--mono);background:repeating-linear-gradient(135deg,transparent 0 9px,rgba(27,44,168,.05) 9px 10px)}
.ph-text{color:var(--cobalt);font:400 .82em/1.4 var(--mono);border-bottom:1.5px dashed var(--cobalt)}

.notice{background:var(--ink);color:var(--sheet);padding:7px var(--gutter)}

/* Header */
header{display:flex;align-items:center;gap:clamp(14px,2.4vw,36px);padding:14px var(--gutter);background:var(--cobalt);color:#fff;position:relative;z-index:2;border-bottom:1px solid rgba(255,255,255,.28)}
.logo{display:block;line-height:0}
.logo img{height:30px;width:auto;display:block}
nav{display:flex;gap:clamp(12px,1.7vw,26px);margin-left:auto;font:500 15px/1 var(--display);font-stretch:90%}
nav a{text-decoration:none;padding:6px 0}
nav a:hover{text-decoration:underline;text-underline-offset:5px}
.lang{display:flex;font:400 12px/1 var(--mono);border:1px solid rgba(255,255,255,.6)}
.lang button{background:none;border:0;color:#fff;font:inherit;padding:7px 9px;cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:var(--cobalt)}

/* Hero: the drawing sheet */
.hero{background-color:var(--cobalt);color:#fff;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:32px 32px;padding:clamp(28px,4vw,56px) var(--gutter) clamp(24px,3vw,40px);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);column-gap:clamp(24px,4vw,64px);align-items:stretch}
.hero h1{font-size:clamp(3.1rem,7.1vw,7rem);margin:14px 0 22px}
.hero-copy{display:flex;flex-direction:column}
.hero-copy .lede{max-width:33em;font-size:1.1em}
.hero-copy .btn{align-self:flex-start;margin-top:26px;background:#fff;border-color:#fff;color:var(--cobalt)}
.hero-copy .btn:hover{background:var(--calque);border-color:var(--calque)}
.note{margin-top:auto;padding-top:26px;max-width:42em;opacity:.82}
.study{display:grid;grid-template-rows:auto auto;border:1px solid rgba(255,255,255,.55);min-width:0}
.study-draw{position:relative;min-width:0}
#massing{display:block;width:100%;height:auto;max-height:50vh;min-height:280px}
.tag{position:absolute;top:10px;left:12px}
.presets{position:absolute;top:8px;right:10px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;max-width:70%}
.presets button{background:rgba(27,44,168,.75);color:#fff;border:1px solid rgba(255,255,255,.55);font:400 12px/1 var(--mono);padding:6px 8px;cursor:pointer}
.presets button:hover,.presets button[aria-pressed=true]{background:#fff;color:var(--cobalt)}
.controls{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(255,255,255,.55)}
.control{padding:11px 14px 13px;border-right:1px solid rgba(255,255,255,.55);min-width:0}
.control:last-child{border-right:0}
.control label{display:flex;justify-content:space-between;gap:8px;font:400 12px/1.2 var(--mono)}
.control output{font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:none;margin:5px 0 0;cursor:pointer;color:#fff}
input[type=range]::-webkit-slider-runnable-track{height:1.5px;background:#fff}
input[type=range]::-moz-range-track{height:1.5px;background:#fff}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:20px;margin-top:-9px;background:#fff;border:0;border-radius:0}
input[type=range]::-moz-range-thumb{width:14px;height:20px;background:#fff;border:0;border-radius:0}
.results{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(255,255,255,.55)}
.result{padding:10px 14px 12px;border-right:1px solid rgba(255,255,255,.55)}
.result:last-child{border-right:0}
.result .big{display:block;font-size:clamp(1.7rem,2.9vw,2.8rem);margin-top:5px;white-space:nowrap;font-variant-numeric:tabular-nums}

[hidden]{display:none!important}
.hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-top:26px}
.hero-copy .hero-actions .btn{margin-top:0}
.hero-actions .text-link{font:600 15px/1.2 var(--display);font-stretch:90%;text-underline-offset:5px}

/* Cost estimator */
.estimator{background:var(--sheet)}
.est-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-items:start}
.est-inputs{grid-column:1/7;min-width:0}
.est-result{grid-column:8/13;border:1.5px solid var(--ink);padding:20px;min-width:0}
.est-field{margin-bottom:26px}
.est-field>label,.est-inputs legend{display:block;font:400 12px/1.3 var(--mono);margin-bottom:8px;padding:0}
fieldset{border:0;margin:0 0 26px;padding:0;min-width:0}
.est-inputs input[type=number]{width:100%;background:transparent;color:inherit;border:0;border-bottom:1.5px solid var(--ink);padding:6px 0;font:500 clamp(1.7rem,3vw,2.5rem)/1.1 var(--display);font-stretch:72%;border-radius:0}
.est-inputs input[type=number]:focus{outline:0;border-bottom-color:var(--cobalt);box-shadow:0 1.5px 0 var(--cobalt)}
.relink{background:none;border:0;padding:0;margin-top:9px;color:var(--cobalt);font:400 12px/1.3 var(--mono);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.tiers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tier{position:relative;display:block;cursor:pointer}
.tier input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.tier span{display:block;height:100%;border:1px solid var(--line);padding:12px;transition:background .15s,color .15s,border-color .15s}
.tier strong{display:block;font:600 1.05rem/1.2 var(--display);font-stretch:90%;margin-bottom:4px}
.tier small{display:block;font-size:.84em;line-height:1.32}
.tier:hover span{border-color:var(--cobalt)}
.tier input:checked+span{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.tier input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.est-total{font-size:clamp(2.1rem,3.7vw,3.5rem);margin:8px 0 18px;font-variant-numeric:tabular-nums}
.est-total span{white-space:nowrap}
.est-rows{margin:0;border-top:1.5px solid var(--ink)}
.est-rows div{display:flex;flex-wrap:wrap;justify-content:space-between;gap:3px 16px;padding:9px 0;border-bottom:1px solid var(--line)}
.est-rows dt{white-space:nowrap}
.est-rows dd{margin:0 0 0 auto;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.est-note{margin-top:14px;color:var(--muted)}
.est-sample{display:inline-block;margin-top:12px}
.est-result .btn{margin-top:18px}

/* Project types */
.types{border-top:1.5px solid var(--ink)}
.type{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;padding:22px 0;border-bottom:1px solid var(--line);align-items:baseline;text-decoration:none;transition:padding .2s,color .2s}
.type:hover{color:var(--cobalt);padding-left:10px}
.type .big{grid-column:1/6;font-size:clamp(1.8rem,3.1vw,3rem)}
.type p{grid-column:6/12}
.type .arrow{grid-column:12;justify-self:end;font:400 18px/1 var(--mono)}

/* Projects */
.projects{background:var(--sheet)}
.feature{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-items:end}
.feature-img{grid-column:1/9;margin:0}
.feature-img img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover}
.feature-copy{grid-column:9/13}
.feature-copy h3{font:500 clamp(1.8rem,3vw,2.8rem)/1 var(--display);font-stretch:72%;margin:8px 0 14px}
.reduction{display:block;font-size:clamp(2.3rem,4.3vw,4rem);margin:18px 0 6px;color:var(--cobalt);font-variant-numeric:tabular-nums}
.reduction span{white-space:nowrap}
.story{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.story figure{margin:0;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.story img{display:block;width:100%;aspect-ratio:16/10;object-fit:contain;padding:6px}
.story figcaption{padding:10px 12px 12px;border-top:1px solid var(--line);flex:1}
.story strong{display:block;font:600 1rem/1.2 var(--display);font-stretch:90%;margin-bottom:3px}
.more-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;margin:clamp(40px,6vw,80px) 0 18px;padding-top:14px;border-top:1.5px solid var(--ink)}
.more-head h3{font:500 clamp(1.5rem,2.4vw,2.2rem)/1 var(--display);font-stretch:72%}
.filters{display:flex;flex-wrap:wrap;gap:5px}
.filters button{background:none;border:1px solid var(--line);color:inherit;font:400 12px/1 var(--mono);padding:8px 10px;cursor:pointer}
.filters button:hover{border-color:var(--cobalt)}
.filters button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.gallery{display:grid;grid-template-columns:repeat(12,1fr);gap:28px 10px}
.card{grid-column:span 4;background:none;border:0;padding:0;margin:0;text-align:left;color:inherit;font:inherit;cursor:pointer;min-width:0}
.gallery:not(.filtered) .card:nth-child(1),.gallery:not(.filtered) .card:nth-child(4){grid-column:span 7}
.gallery:not(.filtered) .card:nth-child(2),.gallery:not(.filtered) .card:nth-child(3){grid-column:span 5}
.gallery.filtered .card{grid-column:span 6}
.card-img{display:block;overflow:hidden;background:var(--calque)}
.card img{display:block;width:100%;height:clamp(220px,26vw,400px);object-fit:cover;transition:transform .5s ease}
.card:hover img{transform:scale(1.025)}
.card strong{display:block;font:600 1.15rem/1.2 var(--display);font-stretch:90%;margin:10px 0 3px}
.card:hover strong{color:var(--cobalt)}
.card .mono{display:block;color:var(--muted)}
.stage-note{margin-top:28px}

/* Project detail */
dialog{border:0;padding:0;background:var(--sheet);color:var(--ink);width:min(1180px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto}
dialog::backdrop{background:rgba(19,33,28,.82)}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:16px 18px}
.dlg-head h3{font:500 clamp(1.7rem,3vw,2.7rem)/1 var(--display);font-stretch:72%}
.dlg-close{background:none;border:1.5px solid var(--ink);color:inherit;font:600 14px/1 var(--display);font-stretch:90%;padding:9px 12px;cursor:pointer;white-space:nowrap}
.dlg-main{display:block;width:100%;max-height:62vh;object-fit:contain;background:#fff}
.dlg-thumbs{display:flex;gap:6px;padding:8px 18px 0;overflow-x:auto}
.dlg-thumbs button{flex:0 0 auto;padding:0;border:2px solid transparent;background:none;cursor:pointer;line-height:0}
.dlg-thumbs button[aria-current=true]{border-color:var(--cobalt)}
.dlg-thumbs img{width:92px;height:60px;object-fit:cover}
.dlg-body{display:grid;grid-template-columns:3fr 2fr;gap:24px;padding:18px 18px 24px}
.dlg-facts{margin:0;border-top:1.5px solid var(--ink)}
.dlg-facts div{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--line)}
.dlg-facts dd{margin:0;text-align:right}

/* Mission phases: a dimension line */
.mission{background:var(--cedar);color:var(--sheet)}
.mission .section-head p{color:inherit;opacity:.85}
.phases{display:grid;grid-template-columns:repeat(6,1fr);list-style:none;margin:0;padding:0;border-top:1.5px solid var(--sheet)}
.phases li{position:relative;padding:20px 16px 0 0}
.phases li::before{content:"";position:absolute;top:-8px;left:0;width:1.5px;height:15px;background:var(--sheet);transform:rotate(35deg)}
.phases .mono{display:block;margin-bottom:12px}
.phases h3{margin-bottom:8px}
.phases p{font-size:.92em;line-height:1.38;opacity:.88}

/* Remote follow-up */
.remote{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-items:start}
.remote-copy{grid-column:1/7}
.remote-copy h2{margin-bottom:22px}
.remote ul{list-style:none;margin:26px 0 0;padding:0;border-top:1.5px solid var(--ink)}
.remote li{padding:11px 0;border-bottom:1px solid var(--line)}
.report{grid-column:8/13;background:var(--sheet);padding:18px;border:1px solid var(--line)}
.report-head{display:flex;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--ink);margin-bottom:12px}
.report-photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.report-photos .ph{aspect-ratio:4/3}
.report dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.report dt{color:var(--muted)}
.report dd{margin:0}

/* Practice */
.practice{background:var(--sheet)}
.partners{display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
.partner{grid-column:span 3}
.partner .ph{aspect-ratio:4/5;margin-bottom:12px}
.practice-copy{grid-column:8/13}
.practice-copy p+p{margin-top:1em}
.credentials{margin-top:22px;display:grid;gap:8px}

/* Guides */
.guides{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;border-top:1.5px solid var(--ink);padding-top:18px}
.guide .ph-text{display:inline-block;margin-bottom:12px}

/* Contact */
.contact{background:var(--ink);color:var(--sheet)}
.contact-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
.contact-intro{grid-column:1/6}
.contact-intro p{margin-top:20px;opacity:.86}
.contact .ph-text{color:#AEB8FF;border-color:#AEB8FF}
form{grid-column:7/13;display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
form .full{grid-column:1/-1}
form label{display:block;font:400 12px/1.3 var(--mono);margin-bottom:7px}
input[type=text],input[type=tel],input[type=email],select,textarea{width:100%;background:transparent;color:inherit;border:0;border-bottom:1.5px solid rgba(243,245,240,.55);padding:8px 0;font:400 17px/1.3 var(--body);border-radius:0}
select option{color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-bottom-color:#fff;box-shadow:0 1.5px 0 #fff}
textarea{resize:vertical;min-height:84px}
.sketch{border:1px solid rgba(243,245,240,.4);padding:10px 12px}
.contact .btn.solid{background:var(--sheet);border-color:var(--sheet);color:var(--ink);justify-self:start}
.contact .btn.solid:hover{background:#fff}
.form-status{align-self:center;min-height:1.4em}

footer{background:var(--ink);color:var(--sheet);padding:0 var(--gutter) 28px}
.title-block{display:grid;grid-template-columns:2fr 1fr 1fr;border:1px solid rgba(243,245,240,.4)}
.title-block div{padding:10px 12px;border-right:1px solid rgba(243,245,240,.4)}
.title-block div:last-child{border-right:0}
.title-block .ph-text{color:#AEB8FF;border-color:#AEB8FF}
.foot-logo{display:block;width:min(240px,100%);height:auto}
.contact-phones{font-size:clamp(1.05rem,1.6vw,1.35rem)}
.contact-phones a{text-underline-offset:4px}

@media (max-width:980px){
  header{flex-wrap:wrap}
  nav{order:3;width:100%;margin:0;overflow-x:auto;padding-bottom:2px;white-space:nowrap}
  .lang{margin-left:auto}
  .hero{grid-template-columns:1fr}
  .note{margin-top:0;order:3;padding-top:18px}
  .hero-copy{display:contents}
  .hero-copy>*{grid-column:1}
  .hero-copy .btn{justify-self:start}
  .study{order:2;margin-top:28px}
  .section-head h2,.section-head p{grid-column:1/-1}
  .est-inputs,.est-result{grid-column:1/-1}
  .feature-img,.feature-copy{grid-column:1/-1}
  .story{grid-template-columns:1fr 1fr}
  .gallery .card,.gallery:not(.filtered) .card:nth-child(n){grid-column:span 6}
  .dlg-body{grid-template-columns:1fr}
  .type .big,.type p{grid-column:1/12}
  .type{gap:8px}
  .type .arrow{grid-row:1;grid-column:12}
  .phases{grid-template-columns:1fr;border-top:0;border-left:1.5px solid var(--sheet)}
  .phases li{padding:0 0 26px 20px}
  .phases li::before{top:5px;left:-8px;width:15px;height:1.5px}
  .remote-copy,.report{grid-column:1/-1}
  .partner{grid-column:span 6}
  .practice-copy{grid-column:1/-1}
  .guides{grid-template-columns:1fr 1fr}
  .contact-intro,form{grid-column:1/-1}
}
@media (max-width:620px){
  .gallery .card,.gallery:not(.filtered) .card:nth-child(n){grid-column:1/-1}
  .card img{height:58vw}
  .controls,.results{grid-template-columns:1fr}
  .control,.result{border-right:0;border-bottom:1px solid rgba(255,255,255,.3)}
  .control:last-child,.result:last-child{border-bottom:0}
  .results{grid-template-columns:1fr 1fr}
  .result:last-child{grid-column:1/-1}
  .result:nth-child(1){border-right:1px solid rgba(255,255,255,.3)}
  .presets{position:static;justify-content:flex-start;max-width:none;padding:38px 12px 0}
  #massing{min-height:0;max-height:none}
  .guides{grid-template-columns:1fr}
  form{grid-template-columns:1fr}
  .title-block{grid-template-columns:1fr}
  .title-block div{border-right:0;border-bottom:1px solid rgba(243,245,240,.4)}
  .title-block div:last-child{border-bottom:0}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important}
}
</style>
</head>
<body>

<div class="notice mono" data-t="notice"></div>

<header>
  <a class="logo" href="#top"><img src="assets/logo-mma-white.png" alt="MMA, Mharrech Mribah Architects" width="500" height="172"></a>
  <nav aria-label="Main">
    <a href="#projects" data-t="navProjects"></a>
    <a href="#estimator" data-t="navEstimate"></a>
    <a href="#mission" data-t="navMission"></a>
    <a href="#practice" data-t="navPractice"></a>
    <a href="#guides" data-t="navGuides"></a>
    <a href="#contact" data-t="navContact"></a>
  </nav>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="fr">FR</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<main id="top">

<section class="hero">
  <div class="hero-copy">
    <h1 data-t="heroTitle"></h1>
    <p class="lede" data-t="heroLede"></p>
    <div class="hero-actions">
      <a class="btn" href="#contact" data-t="ctaProject"></a>
      <a class="text-link" href="#estimator" data-t="ctaEstimate"></a>
    </div>
    <p class="note mono" data-t="heroNote"></p>
  </div>
  <div class="study">
    <div class="study-draw">

const $ = id => document.getElementById(id);
const PRESETS = {villa:{area:600,cover:35,floors:2},building:{area:300,cover:70,floors:5},hotel:{area:1000,cover:50,floors:4}};
const STOREY = 3.2, K = 5.5, CX = 280, CY = 262;
const COS = Math.cos(Math.PI/6), SIN = .5;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

let lang = 'en';
try { lang = localStorage.getItem('mma-lang') || (navigator.language.startsWith('fr') ? 'fr' : 'en'); } catch(e) {}

const fmt = n => Math.round(n).toLocaleString(lang === 'fr' ? 'fr-FR' : 'en-GB');
const levels = f => f === 1 ? T[lang].ground : `${T[lang].ground}+${f-1}`;
const p = (x,y,z=0) => [(CX+(x-y)*COS*K).toFixed(1),(CY+(x+y)*SIN*K-z*K).toFixed(1)].join(',');
const poly = (pts,attrs) => `<polygon points="${pts.join(' ')}" ${attrs}/>`;

function draw(s){
  const h = Math.sqrt(s.area)/2, b = h*Math.sqrt(s.cover/100), H = s.floors*STOREY;
  const sx = -.38*H, sy = .1*H;
  const foot = [[b,b],[b,-b],[-b,-b],[-b,b]];
  let out = '';
  // Plot boundary with a 5 m grid
  let grid = '';
  for(let g=-h+5;g<h;g+=5){
    grid += `<line x1="${p(g,-h).split(',')[0]}" y1="${p(g,-h).split(',')[1]}" x2="${p(g,h).split(',')[0]}" y2="${p(g,h).split(',')[1]}"/>`;
    grid += `<line x1="${p(-h,g).split(',')[0]}" y1="${p(-h,g).split(',')[1]}" x2="${p(h,g).split(',')[0]}" y2="${p(h,g).split(',')[1]}"/>`;
  }
  out += `<g stroke="#fff" stroke-opacity=".2" stroke-width=".75">${grid}</g>`;
  out += poly([p(h,h),p(h,-h),p(-h,-h),p(-h,h)],'fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="7 4"');
  // Cast shadow
  let shadow = poly(foot.map(c=>p(c[0]+sx,c[1]+sy)),'');
  foot.forEach((c,i)=>{ const d = foot[(i+1)%4]; shadow += poly([p(c[0],c[1]),p(d[0],d[1]),p(d[0]+sx,d[1]+sy),p(c[0]+sx,c[1]+sy)],''); });
  out += `<g fill="#070F55" opacity=".5">${shadow}</g>`;
  // Volume
  out += poly([p(-b,b),p(b,b),p(b,b,H),p(-b,b,H)],'fill="#D8DDFB" stroke="#1B2CA8" stroke-width=".8"');
  out += poly([p(b,b),p(b,-b),p(b,-b,H),p(b,b,H)],'fill="#ABB5F2" stroke="#1B2CA8" stroke-width=".8"');
  out += poly([p(b,b,H),p(b,-b,H),p(-b,-b,H),p(-b,b,H)],'fill="#fff" stroke="#1B2CA8" stroke-width=".8"');
  // Floor lines
  let lines = '';
  for(let i=1;i<s.floors;i++){
    const z = i*STOREY;
    lines += `<polyline points="${p(-b,b,z)} ${p(b,b,z)} ${p(b,-b,z)}"/>`;
  }
  out += `<g fill="none" stroke="#1B2CA8" stroke-width=".9">${lines}</g>`;
  // Dimensions along the plot edges
  const side = Math.sqrt(s.area);
  const [lx,ly] = p(0,h+1.5+7/K).split(',').map(Number);
  const [rx,ry] = p(h+1.5+7/K,0).split(',').map(Number);
  const dim = `font-family="DM Mono,monospace" font-size="12" fill="#fff" text-anchor="middle"`;
  out += `<text x="${lx}" y="${ly}" ${dim} transform="rotate(30 ${lx} ${ly})">${fmt(side)} ${T[lang].unitM}</text>`;
  out += `<text x="${rx}" y="${ry}" ${dim} transform="rotate(-30 ${rx} ${ry})">${fmt(side)} ${T[lang].unitM}</text>`;
  $('massing').innerHTML = out;
}

function values(){ return {area:+$('area').value,cover:+$('cover').value,floors:+$('floors').value}; }

function readouts(){
  const v = values(), fp = v.area*v.cover/100, total = fp*v.floors;
  $('areaOut').textContent = `${fmt(v.area)} m²`;
  $('coverOut').textContent = `${v.cover} %`;
  $('floorsOut').textContent = levels(v.floors);
  $('resFootprint').textContent = `${fmt(fp)} m²`;
  $('resHeight').textContent = levels(v.floors);
  $('resArea').textContent = `${fmt(total)} m²`;
  $('sketchSummary').textContent = `${fmt(v.area)} m² · ${v.cover} % · ${levels(v.floors)} · ${fmt(total)} m²`;
  $('massing').setAttribute('aria-label',`${T[lang].studyTag}: ${$('sketchSummary').textContent}`);
  estimate();
}

// Sample figures. MMA must replace these with its own rates before launch.
const ESTIMATE = {
  ratesPerM2:{structure:[3200,4400],standard:[5500,7500],premium:[8000,12000],highend:[12500,18000]},
  feePercent:[6,12],
  contingencyPercent:10
};
let areaLinked = true;
const money = n => fmt(Math.round(n/1e4)*1e4);
const range = (lo,hi) => `${money(lo)} – ${money(hi)} MAD`;

function estimate(){
  const v = values();
  if(areaLinked) $('estArea').value = Math.round(v.area*v.cover/100*v.floors);
  $('estRelink').hidden = areaLinked;
  const area = Number($('estArea').value), land = Math.max(0,Number($('estLand').value)||0);
  const [rateLo,rateHi] = ESTIMATE.ratesPerM2[document.querySelector('input[name=tier]:checked').value];
  const [feeLo,feeHi] = ESTIMATE.feePercent, cont = ESTIMATE.contingencyPercent/100;
  $('rowFeesLabel').textContent = `${T[lang].rowFees} (${feeLo}–${feeHi} %)`;
  $('rowContLabel').textContent = `${T[lang].rowCont} (${ESTIMATE.contingencyPercent} %)`;
  $('rowLandWrap').hidden = !land;
  const valid = area > 0;
  $('estRows').hidden = !valid;
  if(!valid){
    $('estTotal').textContent = T[lang].estEmpty;
    $('estimateSummary').textContent = '–';
    return;
  }
  const buildLo = area*rateLo, buildHi = area*rateHi;
  const lo = buildLo*(1+feeLo/100+cont)+land, hi = buildHi*(1+feeHi/100+cont)+land;
  $('estTotal').innerHTML = `<span>${money(lo)}</span> – <span>${money(hi)}</span> <span>MAD</span>`;
  $('rowBuild').textContent = range(buildLo,buildHi);
  $('rowFees').textContent = range(buildLo*feeLo/100,buildHi*feeHi/100);
  $('rowCont').textContent = range(buildLo*cont,buildHi*cont);
  $('rowLand').textContent = `${fmt(land)} MAD`;
  $('estimateSummary').textContent = range(lo,hi);
}

$('estArea').addEventListener('input',()=>{ areaLinked = false; estimate(); });
$('estRelink').addEventListener('click',()=>{ areaLinked = true; estimate(); });
$('estLand').addEventListener('input',estimate);
document.querySelectorAll('input[name=tier]').forEach(r=>r.addEventListener('change',estimate));
$('estForm').addEventListener('submit',e=>e.preventDefault());

let current = values(), raf;
function animateTo(target){
  cancelAnimationFrame(raf);
  if(reduceMotion){ current = target; draw(current); return; }
  const from = {...current}, start = performance.now(), dur = 520;
  (function step(now){
    const t = Math.min((now-start)/dur,1), e = 1-Math.pow(1-t,3);
    current = {area:from.area+(target.area-from.area)*e,cover:from.cover+(target.cover-from.cover)*e,floors:from.floors+(target.floors-from.floors)*e};
    current.floors = t<1 ? Math.max(1,current.floors) : target.floors;
    draw(t<1 ? {...current,floors:Math.round(current.floors)} : target);
    if(t<1) raf = requestAnimationFrame(step); else current = target;
  })(start);
}

function markPreset(name){
  document.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.preset===name));
}

['area','cover','floors'].forEach(id=>$(id).addEventListener('input',()=>{
  cancelAnimationFrame(raf); current = values(); draw(current); readouts(); markPreset(null);
}));
document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{
  const v = PRESETS[b.dataset.preset];
  $('area').value = v.area; $('cover').value = v.cover; $('floors').value = v.floors;
  readouts(); animateTo(v); markPreset(b.dataset.preset);
}));

const FILTERS = [['all','fAll'],['apartments','fApartments'],['hospitality','fHospitality'],['villas','fVillas']];
const img = name => `assets/${name}.webp`;
let activeFilter = 'all', openId = null;

function renderProjects(){
  $('filters').innerHTML = FILTERS.map(([k,l])=>`<button type="button" data-filter="${k}" aria-pressed="${k===activeFilter}">${T[lang][l]}</button>`).join('');
  const list = PROJECTS.filter(p=>activeFilter==='all'||p.type===activeFilter);
  $('gallery').classList.toggle('filtered',activeFilter!=='all');
  $('gallery').innerHTML = list.map(p=>{
    const c = p[lang];
    return `<button class="card" type="button" data-project="${p.id}"><span class="card-img"><img src="${img(p.cover)}" alt="" loading="lazy"></span><strong>${c.name}</strong><span class="mono">${[c.place,c.kind].filter(Boolean).join(' · ')}</span></button>`;
  }).join('');
}

function showImage(name,alt){
  $('dlgMain').src = img(name);
  $('dlgMain').alt = alt;
  $('dlgThumbs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.image===name));
}

function localizeFact(v){
  const text = v.replace('~',T[lang].factAbout+' ');
  return lang === 'en' ? text.replace(/(\d) (\d{3})/,'$1,$2') : text;
}

function fillDialog(id){
  const p = id===FEATURED.id ? FEATURED : PROJECTS.find(x=>x.id===id), c = p[lang];
  $('dlgTitle').textContent = c.name;
  $('dlgMeta').textContent = [c.place,c.kind].filter(Boolean).join(' · ');
  $('dlgText').textContent = c.text;
  $('dlgThumbs').innerHTML = p.images.map(n=>`<button type="button" data-image="${n}" aria-label="${c.name}"><img src="${img(n)}" alt="" loading="lazy"></button>`).join('');
  const facts = c.place ? p.facts : [['factLocation',null],...p.facts];
  $('dlgFacts').innerHTML = facts.map(([k,v])=>`<div><dt>${T[lang][k]}</dt><dd>${v===null?`<span class="ph-text">${T[lang].toConfirm}</span>`:localizeFact(v)}</dd></div>`).join('');
  showImage(p.images[0],c.name);
}

  const open = e.target.closest('[data-project]');
  if(open){ openId = open.dataset.project; fillDialog(openId); $('projectDialog').showModal(); return; }
  const f = e.target.closest('[data-filter]');
  if(f){ activeFilter = f.dataset.filter; renderProjects(); return; }
  const th = e.target.closest('[data-image]');
  if(th) showImage(th.dataset.image,$('dlgTitle').textContent);
});

function applyLang(next){
  lang = next;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent = T[lang][el.dataset.t]; });
  document.querySelectorAll('[data-t-alt]').forEach(el=>{ el.alt = T[lang][el.dataset.tAlt]; });
  renderProjects();
  if(openId) fillDialog(openId);
  document.querySelectorAll('[data-t-label]').forEach(el=>el.setAttribute('aria-label',T[lang][el.dataset.tLabel]));
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  $('formStatus').textContent = '';
  try { localStorage.setItem('mma-lang',lang); } catch(e) {}
  readouts(); draw(current);
}
